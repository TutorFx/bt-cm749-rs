name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Shellcheck the installer and CI scripts
        run: shellcheck -S warning install.sh ci/*.sh

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  kernel-sources:
    name: Patch real kernel sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: /tmp/dkms-kernel-src
          key: kernel-tarballs-v1
      - run: cargo test --locked --test kernel_sources patches_multiple_kernels -- --ignored

  build:
    uses: ./.github/workflows/build.yml

  dkms-e2e:
    name: DKMS end-to-end (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu verifies the skip: its supported kernels already ship the fix.
        image: ["archlinux:latest", "fedora:41", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bt-cm749-x86_64-linux-musl
      - run: chmod +x bt-cm749-x86_64-linux-musl && ci/dkms-e2e.sh "$PWD/bt-cm749-x86_64-linux-musl"

  installer:
    name: One-command installer
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bt-cm749-x86_64-linux-musl
      - run: ci/installer-test.sh "$PWD/bt-cm749-x86_64-linux-musl"
