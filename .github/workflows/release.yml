# Push a tag such as v0.3.0 to publish a release. Users install it with the
# one-line command from the README, which always fetches the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Point the installer at this repository
        run: sed "s|^REPO=.*|REPO=\"\${BT_CM749_REPO:-${GITHUB_REPOSITORY}}\"|" install.sh > dist/install.sh
      - name: Write the release notes
        run: |
          cat > notes.md <<NOTES
          ## Install

          Open a terminal, paste this command and press Enter (it asks for your password):

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo sh
          \`\`\`

          The installer picks the right file for your computer, checks it and tells you what to do next.
          If your Linux already supports the adapter, it changes nothing.

          To remove it again:

          \`\`\`
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | sudo sh -s -- --uninstall
          \`\`\`

          Manual install: download \`bt-cm749-x86_64-linux-musl\` (most PCs) or \`bt-cm749-aarch64-linux-musl\`
          (ARM, e.g. Raspberry Pi), then run \`chmod +x\` on it and \`sudo ./bt-cm749-... install\`.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
