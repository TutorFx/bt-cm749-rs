name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: static binary (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: rust:1-alpine
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache musl-dev make perl
      - run: cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl
      - run: |
          name=bt-cm749-${{ matrix.arch }}-linux-musl
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/bt-cm749 "$name"
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: bt-cm749-${{ matrix.arch }}
          path: bt-cm749-${{ matrix.arch }}-linux-musl*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: bt-cm749-*
          generate_release_notes: true
