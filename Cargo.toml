[package]
name = "bt-cm749"
version = "0.3.0"
license-file = "LICENSE"
description = "Installs a DKMS-patched btusb for Barrot BR8554 (UGREEN CM748/CM749) Bluetooth adapters"
rust-version = "1.85"
edition = "2024"

[dependencies]
rustix = { version = "1.1.5", features = ["process", "system"] }
signal-hook = "0.4.5"
thiserror = "2.0.21"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
