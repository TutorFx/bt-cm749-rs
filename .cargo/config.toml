# The binary is copied into the DKMS source tree and re-run by DKMS for future
# kernels, so release builds are fully static to survive libc upgrades.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
